<svg width="500" height="220" viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&amp;display=swap');
      .name-text { font-family: 'Baloo 2', 'Arial Rounded MT Bold', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="500" height="220" rx="18" fill="url(#bgGrad)"/>

  <!-- Main name -->
  <text x="40" y="100" class="name-text" font-weight="700" font-size="54" letter-spacing="1" fill="#f5f5f5">SOFIANE<tspan fill="#e94baa">.</tspan></text>

  <!-- Subtitle with cursive style, like original "- Frontend Developer" -->
  <text x="45" y="150" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="28" fill="#4aa8ff">- Developpeur Junior</text>

  <!-- Small underline flourish under "Developpeur", like the original -->
  <path d="M55 158 Q 90 148, 125 158" stroke="#4aa8ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
